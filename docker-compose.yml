# Local development stack: Django application + single-node Elasticsearch.
#
# This file is intentionally limited to the two services that Phase 1.6
# requires. Additional services (a message broker, a cache, a relational
# database) are excluded by docs/02-non-goals.md and are not introduced
# without a concrete, recorded requirement.
#
# --- Image choice (documented constraint) -----------------------------------
# The canonical image would be:
#     docker.elastic.co/elasticsearch/elasticsearch:8.15.3
# However, docker.elastic.co is a Google Cloud endpoint whose IP range is
# filtered from the development environment (verified in Phase 1.6 by a
# connection timeout to port 443). Multiple mirrors were probed:
#
#   - elastic.m.daocloud.io   reachable but drops large layers mid-transfer
#   - elastic.1ms.run         TLS handshake timeout
#   - elastic.chenby.cn       403 Forbidden
#   - focker.ir               tag not present
#
# The Bitnami-compatible image, pulled through DaoCloud's Docker Hub mirror,
# is the only one that completed reliably. It is functionally equivalent for
# local development: same Elasticsearch version, same HTTP API, same index
# and query semantics. The difference is the container's configuration
# conventions (documented inline below).
#
# This substitution is a development-only decision. It is recorded here so
# that a reader of this repository knows exactly why the canonical image is
# not referenced.
# ----------------------------------------------------------------------------
#
# The configuration disables X-Pack security. Appropriate for local
# development only. See docs/02-non-goals.md § 3.6: this project is a
# technical demonstration, not a production deployment.

services:
  elasticsearch:
    # See the image-choice note at the top of this file.
    image: docker.m.daocloud.io/ecsfin/elasticsearch:8.15.3-bitnami
    container_name: esp-elasticsearch
    environment:
      # Security is disabled for local development only.
      - ELASTICSEARCH_ENABLE_SECURITY=false

      # Explicit node roles. This single container is the only node in the
      # cluster, so it must be master-eligible. It also carries data and
      # serves ingest pipelines. Without an explicit "master" role, the
      # Bitnami image creates a node with no roles, and the single-node
      # discovery mode refuses to bootstrap:
      #     IllegalArgumentException: node with [discovery.type] set to
      #     [single-node] must be master-eligible
      - ELASTICSEARCH_NODE_ROLES=master,data,ingest

      # Cluster identity (Bitnami convention: ELASTICSEARCH_* prefix).
      - ELASTICSEARCH_NODE_NAME=esp-node-01
      - ELASTICSEARCH_CLUSTER_NAME=esp-cluster

      # Heap sized for a laptop; the Bitnami image uses ELASTICSEARCH_JAVA_OPTS
      # (not ES_JAVA_OPTS).
      - ELASTICSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/bitnami/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks:
      - esp-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esp-web
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_DEBUG=true
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - esp-net

volumes:
  esdata:
    driver: local

networks:
  esp-net:
    driver: bridge
